# Reusable: release-please on the default branch (STANDARD.md, "Versioning").
#
# - Opens/updates the Release PR (version bump + CHANGELOG) from Conventional Commits.
# - Merging that PR creates the tag vX.Y.Z and the GitHub Release; outputs say so.
# - A PR opened or updated with GITHUB_TOKEN does not trigger `pull_request` workflows, so the
#   required checks would never run on the Release PR. After release-please touches its PR, this
#   workflow starts the listed workflows with `workflow_dispatch` on the release branch (allowed
#   for GITHUB_TOKEN); their check runs land on the PR's head commit.
# - Optionally moves a floating major tag (v1) to each new release (habze itself uses this).
#
# Caller needs: on push to the default branch; permissions contents/pull-requests/issues/actions:
# write; release-please-config.json + .release-please-manifest.json at the repository root; and
# "Allow GitHub Actions to create and approve pull requests" enabled in the repository settings.
name: Release

on:
  workflow_call:
    inputs:
      config-file:
        description: Path to the release-please config.
        type: string
        required: false
        default: release-please-config.json
      manifest-file:
        description: Path to the release-please manifest.
        type: string
        required: false
        default: .release-please-manifest.json
      dispatch-workflows:
        description: >-
          Workflow files to run on the Release PR branch whenever release-please creates or updates
          it, separated by spaces or newlines. Each needs a `workflow_dispatch` trigger. List every
          workflow that provides a required check. Empty disables it.
        type: string
        required: false
        default: ci.yml pr-title.yml
      update-major-tag:
        description: Move the floating major tag (e.g. v1) to every new release.
        type: boolean
        required: false
        default: false
    outputs:
      release_created:
        description: "'true' when this run created a release."
        value: ${{ jobs.release-please.outputs.release_created }}
      tag_name:
        description: Tag of the created release, e.g. v1.2.3.
        value: ${{ jobs.release-please.outputs.tag_name }}
      version:
        description: Version of the created release, e.g. 1.2.3.
        value: ${{ jobs.release-please.outputs.version }}

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    concurrency:
      group: habze-release-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: false
    outputs:
      release_created: ${{ steps.release.outputs.release_created || 'false' }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: release-please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ github.token }}
          config-file: ${{ inputs.config-file }}
          manifest-file: ${{ inputs.manifest-file }}

      - name: Run the required checks on the Release PR
        if: steps.release.outputs.prs_created == 'true' && inputs.dispatch-workflows != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PRS: ${{ steps.release.outputs.prs }}
          WORKFLOWS: ${{ inputs.dispatch-workflows }}
        run: |
          for branch in $(jq -r '.[].headBranchName' <<< "$PRS"); do
            for workflow in $WORKFLOWS; do
              echo "Dispatching $workflow on $branch"
              gh workflow run "$workflow" --repo "$REPO" --ref "$branch"
            done
          done

      - name: Move the floating major tag
        if: inputs.update-major-tag && steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MAJOR: ${{ steps.release.outputs.major }}
          SHA: ${{ steps.release.outputs.sha }}
        run: |
          tag="v${MAJOR}"
          if gh api "repos/${REPO}/git/ref/tags/${tag}" --silent 2> /dev/null; then
            gh api --method PATCH "repos/${REPO}/git/refs/tags/${tag}" \
              -f sha="$SHA" -F force=true --silent
          else
            gh api --method POST "repos/${REPO}/git/refs" \
              -f ref="refs/tags/${tag}" -f sha="$SHA" --silent
          fi
          echo "${tag} -> ${SHA}"
