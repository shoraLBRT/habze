# Reusable: release-please on the default branch (STANDARD.md, "Versioning").
#
# - Opens/updates the Release PR (version bump + CHANGELOG) from Conventional Commits.
# - Merging that PR creates the tag vX.Y.Z and the GitHub Release; outputs say so.
# - The Release PR is opened with GITHUB_TOKEN, so GitHub creates its `pull_request` runs in an
#   approval-required state (GitHub changelog 2026-06-11). After release-please touches its PR,
#   this workflow approves exactly those runs: event `pull_request`, the release branch, its head
#   commit, triggered by github-actions[bot]. If the token may not approve, it leaves a warning
#   and the owner presses "Approve workflows to run" on the PR.
# - Optionally moves a floating major tag (v1) to each new release (habze itself uses this).
#
# Caller needs: on push to the default branch; permissions contents/pull-requests/issues/actions:
# write; release-please-config.json + .release-please-manifest.json at the repository root; and
# "Allow GitHub Actions to create and approve pull requests" enabled in the repository settings.
name: Release

on:
  workflow_call:
    inputs:
      config-file:
        description: Path to the release-please config.
        type: string
        required: false
        default: release-please-config.json
      manifest-file:
        description: Path to the release-please manifest.
        type: string
        required: false
        default: .release-please-manifest.json
      approve-checks:
        description: Approve the approval-required `pull_request` runs on the Release PR.
        type: boolean
        required: false
        default: true
      update-major-tag:
        description: Move the floating major tag (e.g. v1) to every new release.
        type: boolean
        required: false
        default: false
    outputs:
      release_created:
        description: "'true' when this run created a release."
        value: ${{ jobs.release-please.outputs.release_created }}
      tag_name:
        description: Tag of the created release, e.g. v1.2.3.
        value: ${{ jobs.release-please.outputs.tag_name }}
      version:
        description: Version of the created release, e.g. 1.2.3.
        value: ${{ jobs.release-please.outputs.version }}

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    concurrency:
      group: habze-release-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: false
    outputs:
      release_created: ${{ steps.release.outputs.release_created || 'false' }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: release-please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ github.token }}
          config-file: ${{ inputs.config-file }}
          manifest-file: ${{ inputs.manifest-file }}

      - name: Approve the checks on the Release PR
        if: inputs.approve-checks && steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PRS: ${{ steps.release.outputs.prs }}
        run: |
          # GitHub creates the runs a few seconds after the push to the release branch: wait for
          # them (up to ~2 minutes), then approve every one, twice over, to catch late ones.
          for branch in $(jq -r '.[].headBranchName' <<< "$PRS"); do
            sha="$(gh api "repos/${REPO}/branches/${branch}" --jq .commit.sha)"
            pr="$(gh pr list --repo "$REPO" --head "$branch" --state open --json url --jq '.[0].url')"
            echo "Release PR ${pr:-?}: branch ${branch}, head ${sha}"
            approved=0 failed=0 quiet=0
            for _ in $(seq 1 24); do
              ids="$(gh api "repos/${REPO}/actions/runs?branch=${branch}&event=pull_request&status=action_required&head_sha=${sha}" \
                --jq '.workflow_runs[] | select(.triggering_actor.login == "github-actions[bot]") | .id')"
              if [ -z "$ids" ]; then
                if [ "$approved" -gt 0 ] || [ "$failed" -gt 0 ]; then
                  quiet=$((quiet + 1)); [ "$quiet" -ge 3 ] && break
                fi
                sleep 5; continue
              fi
              quiet=0
              for id in $ids; do
                if gh api --method POST "repos/${REPO}/actions/runs/${id}/approve" --silent; then
                  echo "approved run ${id}"; approved=$((approved + 1))
                else
                  failed=$((failed + 1))
                fi
              done
              [ "$failed" -gt 0 ] && break
              sleep 5
            done
            if [ "$failed" -gt 0 ]; then
              echo "::warning::Could not approve the Release PR's checks; open ${pr:-the Release PR} and press 'Approve workflows to run'."
            elif [ "$approved" -eq 0 ]; then
              echo "::notice::No approval-required runs appeared on ${branch}; nothing to approve."
            fi
          done

      - name: Move the floating major tag
        if: inputs.update-major-tag && steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MAJOR: ${{ steps.release.outputs.major }}
          SHA: ${{ steps.release.outputs.sha }}
        run: |
          tag="v${MAJOR}"
          if gh api "repos/${REPO}/git/ref/tags/${tag}" --silent 2> /dev/null; then
            gh api --method PATCH "repos/${REPO}/git/refs/tags/${tag}" \
              -f sha="$SHA" -F force=true --silent
          else
            gh api --method POST "repos/${REPO}/git/refs" \
              -f ref="refs/tags/${tag}" -f sha="$SHA" --silent
          fi
          echo "${tag} -> ${SHA}"
