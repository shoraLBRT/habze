# From habze (templates/): release-please opens the Release PR (version + CHANGELOG); merging it
# tags vX.Y.Z and publishes the GitHub Release. dispatch-workflows must list every workflow that
# provides a required check; each needs a `workflow_dispatch` trigger.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

jobs:
  release:
    uses: shoraLBRT/habze/.github/workflows/release.yml@v1
    with:
      dispatch-workflows: ci.yml pr-title.yml

